<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập — FINORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Auth layout */
  .auth-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: var(--bg);
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 32px 28px;
    box-shadow: var(--shadow-lg);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .auth-brand__mark {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 6px 18px rgba(22,167,121,0.35);
  }
  .auth-brand__mark svg { width: 22px; height: 22px; }
  .auth-brand__name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text);
  }
  .auth-tag {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-2);
    margin-bottom: 28px;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    margin-bottom: 20px;
  }
  .auth-tabs button {
    padding: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-2);
    border-radius: 10px;
    transition: all 0.15s var(--ease);
  }
  .auth-tabs button.is-active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .auth-footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-2);
    margin-top: 20px;
  }
  .auth-error {
    padding: 10px 14px;
    background: rgba(239,100,100,0.10);
    border: 1px solid rgba(239,100,100,0.25);
    border-radius: var(--r-md);
    color: var(--expense);
    font-size: 13px;
    display: none;
  }
  .auth-error.is-show { display: block; }
  .auth-success {
    padding: 10px 14px;
    background: rgba(22,167,121,0.10);
    border: 1px solid rgba(22,167,121,0.25);
    border-radius: var(--r-md);
    color: var(--primary);
    font-size: 13px;
    display: none;
  }
  .auth-success.is-show { display: block; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand__mark"><i data-lucide="wallet"></i></span>
      <span class="auth-brand__name">FINORA</span>
    </div>
    <p class="auth-tag">Hiểu dòng tiền — Làm chủ tài chính</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="is-active" data-tab="login">Đăng nhập</button>
      <button type="button" data-tab="register">Đăng ký</button>
    </div>

    <form class="auth-form" id="authForm" novalidate>
      <div class="field">
        <label class="field__label" for="authEmail">Email</label>
        <input type="email" id="authEmail" class="input" placeholder="ban@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label class="field__label" for="authPassword">Mật khẩu</label>
        <input type="password" id="authPassword" class="input" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="current-password">
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <button type="submit" class="btn btn--primary" id="authSubmit" style="width:100%;height:44px">
        <i data-lucide="log-in"></i>
        <span id="authSubmitText">Đăng nhập</span>
      </button>
    </form>

    <p class="auth-footer">Dữ liệu của bạn được mã hóa và bảo vệ bởi Supabase</p>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  lucide.createIcons();

  const form = document.getElementById('authForm');
  const emailEl = document.getElementById('authEmail');
  const passEl = document.getElementById('authPassword');
  const submitBtn = document.getElementById('authSubmit');
  const submitText = document.getElementById('authSubmitText');
  const errEl = document.getElementById('authError');
  const okEl = document.getElementById('authSuccess');

  let mode = 'login';

  // Tab switching
  document.querySelectorAll('.auth-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.tab;
      document.querySelectorAll('.auth-tabs button').forEach(b =>
        b.classList.toggle('is-active', b === btn)
      );
      submitText.textContent = mode === 'login' ? 'Đăng nhập' : 'Đăng ký';
      passEl.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
      errEl.classList.remove('is-show');
      okEl.classList.remove('is-show');
    });
  });

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('is-show');
    okEl.classList.remove('is-show');
  }

  function showSuccess(msg) {
    okEl.textContent = msg;
    okEl.classList.add('is-show');
    errEl.classList.remove('is-show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('is-show');
    okEl.classList.remove('is-show');

    const email = emailEl.value.trim();
    const password = passEl.value;

    if (!email || !password) {
      return showError('Vui lòng nhập đầy đủ email và mật khẩu.');
    }
    if (password.length < 6) {
      return showError('Mật khẩu phải có ít nhất 6 ký tự.');
    }

    submitBtn.classList.add('is-loading');
    submitText.textContent = 'Đang xử lý...';

    try {
      if (mode === 'register') {
        await FinoraBackend.Auth.signUp(email, password);
        showSuccess('✓ Đăng ký thành công! Kiểm tra email để xác nhận, sau đó đăng nhập.');
        submitBtn.classList.remove('is-loading');
        submitText.textContent = 'Đăng ký';
      } else {
        await FinoraBackend.Auth.signIn(email, password);
        showSuccess('✓ Đăng nhập thành công! Đang chuyển hướng...');
        setTimeout(() => { window.location.href = 'index.html'; }, 600);
      }
    } catch (err) {
      console.error(err);
      let msg = err.message || 'Có lỗi xảy ra. Vui lòng thử lại.';
      if (msg.includes('Invalid login')) msg = 'Email hoặc mật khẩu không đúng.';
      if (msg.includes('already registered')) msg = 'Email này đã được đăng ký.';
      if (msg.includes('Password')) msg = 'Mật khẩu phải có ít nhất 6 ký tự.';
      showError(msg);
      submitBtn.classList.remove('is-loading');
      submitText.textContent = mode === 'login' ? 'Đăng nhập' : 'Đăng ký';
    }
  });

  // Nếu đã đăng nhập → chuyển vào app luôn
  (async () => {
    const session = await FinoraBackend.Auth.getSession();
    if (session) window.location.href = 'index.html';
  })();
</script>
</body>
</html>
